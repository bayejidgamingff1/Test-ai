<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BAYEJID AI</title>
<style>
  :root { --bg:#0f1117; --card:#1a1d27; --me:#4f6bff; --bot:#242838; --text:#e8eaf2; --muted:#8b90a5; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html, body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,"Noto Sans Bengali",sans-serif; display:flex; flex-direction:column; }
  header { padding:14px 16px; background:var(--card); display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #2a2e40; }
  header h1 { font-size:18px; letter-spacing:1px; }
  header button { background:none; border:1px solid #2a2e40; color:var(--muted); padding:6px 10px; border-radius:8px; font-size:13px; }
  #chat { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:85%; padding:10px 14px; border-radius:16px; line-height:1.5; white-space:pre-wrap; word-wrap:break-word; font-size:15px; }
  .me { align-self:flex-end; background:var(--me); border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:var(--bot); border-bottom-left-radius:4px; }
  .err { align-self:flex-start; background:#3a1d24; color:#ff9aa8; font-size:13px; }
  .typing { color:var(--muted); font-style:italic; }
  form { display:flex; gap:8px; padding:12px; background:var(--card); border-top:1px solid #2a2e40; padding-bottom:max(12px, env(safe-area-inset-bottom)); }
  textarea { flex:1; background:var(--bg); color:var(--text); border:1px solid #2a2e40; border-radius:12px; padding:10px 12px; font:inherit; font-size:15px; resize:none; max-height:120px; outline:none; }
  form button { background:var(--me); color:#fff; border:none; border-radius:12px; padding:0 18px; font-size:15px; }
  form button:disabled { opacity:.5; }
</style>
</head>
<body>
<header>
  <h1>BAYEJID AI</h1>
  <button id="clear" type="button">Clear</button>
</header>
<div id="chat"></div>
<form id="form">
  <textarea id="input" rows="1" placeholder="কিছু লিখো..." autocomplete="off"></textarea>
  <button id="send" type="submit">Send</button>
</form>

<script>
  // ====== Settings ======
  const API_KEY  = "bja_live_bdce9246d8951ebb7cd5e7162b462e5716403844f5f659dce601968f111e718f";
  const ENDPOINT = "https://bayejidai.vercel.app/api/v1/chat";
  // ======================

  const chat = document.getElementById("chat");
  const form = document.getElementById("form");
  const input = document.getElementById("input");
  const send = document.getElementById("send");
  let history = [];

  function add(text, cls) {
    const d = document.createElement("div");
    d.className = "msg " + cls;
    d.textContent = text;
    chat.appendChild(d);
    chat.scrollTop = chat.scrollHeight;
    return d;
  }

  function extractReply(data) {
    if (typeof data === "string") return data;
    return data?.reply ?? data?.response ?? data?.answer ?? data?.text ?? data?.message
      ?? data?.output ?? data?.result ?? data?.data?.reply ?? data?.data?.response
      ?? data?.data?.message ?? data?.choices?.[0]?.message?.content
      ?? JSON.stringify(data);
  }

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    const text = input.value.trim();
    if (!text) return;
    input.value = "";
    input.style.height = "auto";
    add(text, "me");
    history.push({ role: "user", content: text });
    send.disabled = true;
    const typing = add("লিখছে...", "bot typing");

    try {
      const res = await fetch(ENDPOINT, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": "Bearer " + API_KEY,
          "x-api-key": API_KEY
        },
        body: JSON.stringify({ message: text, messages: history })
      });
      const raw = await res.text();
      let data; try { data = JSON.parse(raw); } catch { data = raw; }
      if (!res.ok) throw new Error("HTTP " + res.status + ": " + (typeof data === "string" ? data : JSON.stringify(data)));
      const reply = extractReply(data);
      typing.remove();
      add(reply, "bot");
      history.push({ role: "assistant", content: reply });
    } catch (err) {
      typing.remove();
      add("Error: " + err.message, "err");
      history.pop();
    } finally {
      send.disabled = false;
      input.focus();
    }
  });

  input.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); form.requestSubmit(); }
  });
  input.addEventListener("input", () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 120) + "px";
  });
  document.getElementById("clear").onclick = () => { history = []; chat.innerHTML = ""; };

  add("হ্যালো! আমি BAYEJID AI। কী জানতে চাও?", "bot");
</script>
</body>
</html>
